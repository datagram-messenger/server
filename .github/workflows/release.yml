name: Release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Build-only version (must be vMAJOR.MINOR.PATCH)
        required: true
        default: v0.0.0

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.25.0'

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Validate tag or build-only version
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "invalid version: $VERSION" >&2
            exit 1
          }
      - run: go mod verify
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/api_datagram

  build:
    name: Cross-compile release artifacts
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build archives and checksums
        env:
          VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: ./scripts/build-release.sh --output dist --version "$VERSION"
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api_datagram-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: api_datagram-${{ github.ref_name }}
          path: dist
      - name: Publish tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --verify-tag --generate-notes --title "${{ github.ref_name }}"
