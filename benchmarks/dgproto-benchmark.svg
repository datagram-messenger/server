<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Messenger payload over DGProto v1 vs HTTP/1.1 JSON envelope</title><desc id="desc">Local in-memory serialization benchmark using the same JSON payload and ChaCha20-Poly1305 body sealing for both envelopes; no network or TLS handshake.</desc>
