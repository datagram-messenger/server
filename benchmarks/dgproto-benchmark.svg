<line x1="54" y1="852" x2="1546" y2="852" stroke="#263244"/><text x="54" y="886" class="foot">Synthetic codec benchmark · same ChaCha20-Poly1305 · deterministic payloads · count=5</text><text x="54" y="914" class="foot">No network I/O, handshake, scheduling, application serialization, masking, compression, or full-stack behavior.</text><text x="54" y="942" class="foot">Baselines are local synthetic framing codecs—not complete WebSocket or other production protocol implementations.</text><text x="1546" y="886" text-anchor="end" class="foot">Intel(R) Xeon(R) CPU E5-2689 0 @ 2.60GHz</text><text x="1546" y="914" text-anchor="end" class="foot">go1.26.5 · windows/amd64</text><text x="1546" y="942" text-anchor="end" class="foot">Source: benchmarks/results/latest.jsonl</text>
