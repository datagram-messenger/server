<line x1="48" y1="825" x2="1552" y2="825" stroke="#263244"/><text x="48" y="858" class="panelTitle">Scope and interpretation</text><text x="48" y="886" class="foot">Results are mixed: synthetic HTTP encode is faster here; DGProto v1 decode is faster at 64 B and its envelope has less overhead.</text><text x="48" y="912" class="foot">No global protocol ranking follows. Excludes JSON serialization, network, TLS, Noise handshake, routing, persistence, scheduling, and app work.</text><text x="48" y="940" class="foot">Intel Xeon E5-2689 0 · windows/amd64 · count=5 · benchtime=1s · methodology: benchmarks/METHODOLOGY.md</text>
